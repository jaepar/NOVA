services:
  backend:
    image: jaypark0205/nova-backend:latest
    container_name: nova-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AI_BASE_URL: ${AI_BASE_URL}
      CORE_BANKING_BASE_URL: ${CORE_BANKING_BASE_URL}
      GOVERNMENT_BASE_URL: ${GOVERNMENT_BASE_URL}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
