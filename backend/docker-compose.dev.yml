services:
  redis:
    image: redis:7-alpine
    container_name: nova-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-dev-data:/data

  backend:
    image: jaypark0205/nova-backend:dev
    container_name: nova-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORE_BANKING_BASE_URL: ${CORE_BANKING_BASE_URL}
      GOVERNMENT_DB_URL: ${GOVERNMENT_DB_URL}
      AI_BASE_URL: ${AI_BASE_URL}
      BANKING_TRANSFER_PASSWORD_VERIFIED_SLEEP_MS: ${BANKING_TRANSFER_PASSWORD_VERIFIED_SLEEP_MS:-10000}
      REGISTRATION_NUMBER_HMAC_SECRET: ${REGISTRATION_NUMBER_HMAC_SECRET}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_BASE_URL: ${AWS_S3_BASE_URL}
      CLOVA_OCR_URL: ${CLOVA_OCR_URL}
      CLOVA_OCR_SECRET: ${CLOVA_OCR_SECRET}
      AWS_LIVENESS_OUTPUT_PREFIX: ${AWS_LIVENESS_OUTPUT_PREFIX:-liveness}
      AWS_LIVENESS_THRESHOLD: ${AWS_LIVENESS_THRESHOLD}
      AWS_SIMILARITY_THRESHOLD: ${AWS_SIMILARITY_THRESHOLD}
      AWS_AUDIT_IMAGES_LIMIT: ${AWS_AUDIT_IMAGES_LIMIT}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      KOREAEXIM_AUTH_KEY: ${KOREAEXIM_AUTH_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  redis-dev-data:
