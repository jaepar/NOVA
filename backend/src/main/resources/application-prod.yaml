server:
  port: 9000
  servlet:
    context-path: /
    session:
      timeout: 30m

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  docker:
    compose:
      enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

logging:
  level:
    root: info
    org.hibernate.SQL: warn

app:
  core-banking:
    base-url: ${ONPREM_GATEWAY_BASE_URL}
  government:
    base-url: ${ONPREM_GATEWAY_BASE_URL}
  ai:
    base-url: ${AI_BASE_URL}

identity:
  registration-number:
    hmac-secret: ${REGISTRATION_NUMBER_HMAC_SECRET}

cloud:
  aws:
    s3:
      region: ap-northeast-1
      bucket: ${AWS_S3_BUCKET}
      base-url: ${AWS_S3_BASE_URL}

kyc:
  verification:
    passport-ocr:
      url: ${CLOVA_OCR_URL}
      secret: ${CLOVA_OCR_SECRET}
    rekognition:
      region: ap-northeast-1
      output-bucket: ${AWS_S3_BUCKET}
      output-prefix: ${AWS_LIVENESS_OUTPUT_PREFIX:liveness}
      liveness-threshold: ${AWS_LIVENESS_THRESHOLD}
      similarity-threshold: ${AWS_SIMILARITY_THRESHOLD}
      audit-images-limit: ${AWS_AUDIT_IMAGES_LIMIT}