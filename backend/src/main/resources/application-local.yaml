server:
  port: 8000
  servlet:
    context-path: /
    session:
      timeout: 30m

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  docker:
    compose:
      enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

logging:
  level:
    root: info
    org.hibernate.SQL: debug

app:
  core-banking:
    base-url: ${CORE_BANKING_BASE_URL:http://localhost:8001}
  government:
    base-url: ${GOVERNMENT_DB_URL:http://localhost:8002}
#  ai:
#    base-url: ${AI_BASE_URL}

identity:
  registration-number:
    hmac-secret: ${REGISTRATION_NUMBER_HMAC_SECRET}

cloud:
  aws:
    s3:
      region: ap-northeast-1
      bucket: ${AWS_S3_BUCKET}
      base-url: ${AWS_S3_BASE_URL}

kyc:
  verification:
    passport-ocr:
      url: ${CLOVA_OCR_URL}
      secret: ${CLOVA_OCR_SECRET}
    rekognition:
      region: ap-northeast-1
      output-bucket: ${AWS_S3_BUCKET}
      output-prefix: ${AWS_LIVENESS_OUTPUT_PREFIX:liveness}
      liveness-threshold: ${AWS_LIVENESS_THRESHOLD}
      similarity-threshold: ${AWS_SIMILARITY_THRESHOLD}
      audit-images-limit: ${AWS_AUDIT_IMAGES_LIMIT}
