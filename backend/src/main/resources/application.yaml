spring:
  application:
    name: backend
  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

  session:
    store-type: redis
    redis:
      namespace: nova:session
      flush-mode: on_save
      save-mode: on_set_attribute

server:
  tomcat:
    # multipart 각 파트의 헤더 길이 제한(기본 512 bytes) 상향
    max-part-header-size: 8KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
