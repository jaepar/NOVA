name: Backend CD with Gradle and Docker (AWS Prod)

on:
  push:
    branches:
      - 'main'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cloud-prod-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPO: jaypark0205/nova-backend
  AWS_REGION: ap-northeast-2
  ASG_NAME: NOVA-BACKEND-ASG

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      - name: Build with Gradle (without test)
        run: ./gradlew clean build -x test --stacktrace
        working-directory: backend

      - name: Set image tag
        id: meta
        run: echo "image_tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker build & push
        run: |
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

          docker build -f backend/Dockerfile \
            -t "${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.image_tag }}" \
            backend

          docker tag "${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.image_tag }}" "${{ env.IMAGE_REPO }}:prod"

          docker push "${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.image_tag }}"
          docker push "${{ env.IMAGE_REPO }}:prod"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start ASG instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ env.ASG_NAME }}" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}'