name: Frontend CD to Vercel Production

on:
  push:
    branches:
      - 'main'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-vercel-prod-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Required Vercel Environment Variables
        run: |
          test -f .vercel/.env.production.local
          grep -Eq '^VITE_API_BASE_URL=.+$' .vercel/.env.production.local
          grep -Eq '^VITE_AI_API_BASE_URL=.+$' .vercel/.env.production.local
          grep -Eq '^VITE_AWS_REGION=.+$' .vercel/.env.production.local
          grep -Eq '^VITE_AWS_COGNITO_IDENTITY_POOL_ID=.+$' .vercel/.env.production.local
          grep -Eq '^VITE_LIVENESS_REGISTERED_IMAGE_BUCKET=.+$' .vercel/.env.production.local

      - name: Export Vite Environment Variables
        run: |
          node <<'NODE'
          const fs = require('fs');

          const envPath = '.vercel/.env.production.local';
          const githubEnvPath = process.env.GITHUB_ENV;
          const requiredNames = [
            'VITE_API_BASE_URL',
            'VITE_AI_API_BASE_URL',
            'VITE_AWS_REGION',
            'VITE_AWS_COGNITO_IDENTITY_POOL_ID',
            'VITE_LIVENESS_REGISTERED_IMAGE_BUCKET',
          ];

          const envText = fs.readFileSync(envPath, 'utf8');
          const values = new Map();

          for (const rawLine of envText.split(/\r?\n/)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;

            const separatorIndex = line.indexOf('=');
            if (separatorIndex === -1) continue;

            const name = line.slice(0, separatorIndex).trim();
            let value = line.slice(separatorIndex + 1).trim();

            if (
              (value.startsWith('"') && value.endsWith('"')) ||
              (value.startsWith("'") && value.endsWith("'"))
            ) {
              value = value.slice(1, -1);
            }

            values.set(name, value);
          }

          const outputLines = [];
          for (const name of requiredNames) {
            const value = values.get(name);
            if (!value) {
              throw new Error(`${name} is missing from ${envPath}`);
            }
            outputLines.push(`${name}=${value}`);
          }

          fs.appendFileSync(githubEnvPath, `${outputLines.join('\n')}\n`);
          NODE

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vite Environment Was Embedded
        run: |
          test -d .vercel/output/static
          grep -R -F -q -- "$VITE_AWS_REGION" .vercel/output/static
          grep -R -F -q -- "$VITE_AWS_COGNITO_IDENTITY_POOL_ID" .vercel/output/static

      - name: Deploy Project Artifacts to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
