name: Frontend CD to Vercel Production

on:
  push:
    branches:
      - 'main'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-vercel-prod-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Required Vercel Environment Variables
        run: |
          test -f .vercel/.env.production.local
          grep -Eq '^VITE_API_BASE_URL=.+$' .vercel/.env.production.local
          grep -Eq '^VITE_AI_API_BASE_URL=.+$' .vercel/.env.production.local
          grep -Eq '^VITE_AWS_REGION=.+$' .vercel/.env.production.local
          grep -Eq '^VITE_AWS_COGNITO_IDENTITY_POOL_ID=.+$' .vercel/.env.production.local
          grep -Eq '^VITE_LIVENESS_REGISTERED_IMAGE_BUCKET=.+$' .vercel/.env.production.local

      - name: Export Vite Environment Variables
        run: |
          export_vite_env() {
            name="$1"
            line="$(grep -E "^${name}=" .vercel/.env.production.local | tail -n 1)"
            value="${line#*=}"
            value="${value%$'\r'}"
            value="$(printf '%s' "$value" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
            test -n "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }

          export_vite_env VITE_API_BASE_URL
          export_vite_env VITE_AI_API_BASE_URL
          export_vite_env VITE_AWS_REGION
          export_vite_env VITE_AWS_COGNITO_IDENTITY_POOL_ID
          export_vite_env VITE_LIVENESS_REGISTERED_IMAGE_BUCKET

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vite Environment Was Embedded
        run: |
          test -d .vercel/output/static
          grep -R -F -q -- "$VITE_AWS_REGION" .vercel/output/static
          grep -R -F -q -- "$VITE_AWS_COGNITO_IDENTITY_POOL_ID" .vercel/output/static

      - name: Deploy Project Artifacts to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
