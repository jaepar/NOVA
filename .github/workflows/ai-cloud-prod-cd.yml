name: AI CD with Docker (AWS Prod)

on:
  push:
    branches:
      - 'main'
    paths:
      - 'ai/**'
      - '.github/workflows/ai-cloud-prod-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPO: jaypark0205/nova-ai

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ai

      - name: Run tests
        run: pytest -q
        working-directory: ai

      - name: Set image tag
        id: meta
        run: echo "image_tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker build & push
        run: |
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
          docker build -f ai/Dockerfile -t "${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.image_tag }}" ai
          docker tag "${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.image_tag }}" "${{ env.IMAGE_REPO }}:prod"
          docker push "${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.image_tag }}"
          docker push "${{ env.IMAGE_REPO }}:prod"

      - name: Send docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          port: 22
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          proxy_host: ${{ secrets.BASTION_TUNNEL_HOST }}
          proxy_port: ${{ secrets.BASTION_TUNNEL_PORT }}
          proxy_username: ${{ secrets.BASTION_TUNNEL_USER }}
          proxy_key: ${{ secrets.BASTION_HOST_SSH_KEY }}
          source: "ai/docker-compose.yml"
          target: "/home/ubuntu/app"
          strip_components: 1

      - name: Deploy to AI EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        with:
          host: ${{ secrets.AI_EC2_HOST }}
          port: 22
          username: ${{ secrets.AI_EC2_USER }}
          key: ${{ secrets.AI_EC2_SSH_KEY }}
          proxy_host: ${{ secrets.BASTION_TUNNEL_HOST }}
          proxy_port: ${{ secrets.BASTION_TUNNEL_PORT }}
          proxy_username: ${{ secrets.BASTION_TUNNEL_USER }}
          proxy_key: ${{ secrets.BASTION_HOST_SSH_KEY }}
          envs: IMAGE_TAG
          script_stop: true
          script: |
            set -eu
            APP_DIR="/home/ubuntu/app"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker pull "${{ env.IMAGE_REPO }}:${IMAGE_TAG}"
            docker tag "${{ env.IMAGE_REPO }}:${IMAGE_TAG}" "${{ env.IMAGE_REPO }}:prod"

            docker compose --env-file .env -f docker-compose.yml up -d
            docker rmi "${{ env.IMAGE_REPO }}:${IMAGE_TAG}" || true
            docker image prune -a -f
