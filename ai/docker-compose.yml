services:
  ai:
    image: ${AI_IMAGE_REPO:-jaypark0205/nova-ai}:${AI_IMAGE_TAG}
    container_name: ${AI_CONTAINER_NAME:-nova-ai}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      SERVER_PORT: ${SERVER_PORT}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      USE_LLM_INTENT_RESOLVER: ${USE_LLM_INTENT_RESOLVER}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${SERVER_PORT}/health', timeout=3).read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
